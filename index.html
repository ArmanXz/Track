<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Dompet Gajian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kolom tunggal 880px, tab atas; permukaan neumorphism (timbul/tertekan) dari project referensi */
:root{
  --bg:#E7ECF3; --hi:#FFFFFF; --lo:#A9B4C6;
  --ink:#2E3947; --sub:#5F6E85;
  --teal:#2F7F6F; --coral:#C25D53; --amber:#A8742E; --plum:#7D5E9C; --slate:#5E6E82; --blue:#3E7F96; --grey:#8995A6;
  --tint:rgba(47,127,111,.10);
  --f-display:'Sora',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#222935; --hi:#2D3544; --lo:#151A22; --ink:#E4E9F1; --sub:#9AA7BA;
  --teal:#5FBBA7; --coral:#EA8E84; --amber:#E2B470; --plum:#B79AD6; --slate:#9DACBF; --blue:#73B6CC; --grey:#8C98A9;
  --tint:rgba(95,187,167,.12); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#222935; --hi:#2D3544; --lo:#151A22; --ink:#E4E9F1; --sub:#9AA7BA;
  --teal:#5FBBA7; --coral:#EA8E84; --amber:#E2B470; --plum:#B79AD6; --slate:#9DACBF; --blue:#73B6CC; --grey:#8C98A9;
  --tint:rgba(95,187,167,.12); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding:24px 16px 60px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.raised{background:var(--bg);border-radius:20px;box-shadow:8px 8px 16px var(--lo),-8px -8px 16px var(--hi)}
.flat{background:var(--bg);border-radius:14px;box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi)}
.pressed{background:var(--bg);border-radius:12px;box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)} .small{font-size:12px} .tiny{font-size:11px}
.teal{color:var(--teal)} .coral{color:var(--coral)} .amber{color:var(--amber)} .plum{color:var(--plum)}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);font-weight:600}
.label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--sub);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
button{font-family:var(--f-body);cursor:pointer;border:none;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{background:var(--bg);border-radius:12px;box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi);padding:9px 14px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:active,.btn.on{box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.btn.teal{color:var(--teal)} .btn.coral{color:var(--coral)}
.link{background:none;padding:2px 4px;font-size:12px;font-weight:600;color:var(--sub)}
input,select{font-family:var(--f-body);font-size:13px;color:var(--ink);border:none;padding:9px 12px;background:var(--bg);border-radius:10px;box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi);min-width:0}
input[type=number]{font-family:var(--f-mono)}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:0}
.field label{font-size:11.5px;font-weight:600;color:var(--sub)}
.tabs{display:flex;gap:6px;padding:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1 0 auto;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--sub);background:transparent;border-radius:12px}
.tabs button.on{color:var(--teal);box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--grey));flex-shrink:0}
.hero-num{font-family:var(--f-mono);font-size:clamp(26px,7vw,38px);font-weight:700;color:var(--teal);line-height:1.1}
.bar{display:flex;height:16px;border-radius:9px;overflow:hidden;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
.bar>span{display:block;height:100%;background:var(--c)}
.meter{height:8px;border-radius:5px;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--c,var(--teal));border-radius:5px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}
.legend b{margin-left:auto;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:10px 8px;text-align:left;color:var(--sub);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:700;white-space:nowrap}
td{padding:9px 8px;vertical-align:top;border-top:1px solid color-mix(in srgb,var(--lo) 35%,transparent)}
td.r,th.r{text-align:right} td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bill{padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bill .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--f-mono);font-weight:700;font-size:13px}
.bill .main{flex:1 1 180px;min-width:0}
.bill .nm{font-weight:700;font-size:14px}
.alert{padding:12px 14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.alert .dot{margin-top:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:6px}
.day select,.day input{width:100%;font-size:10px;padding:4px 2px;text-align:center;border-radius:8px}
.wbar{display:flex;align-items:flex-end;gap:10px;height:120px;padding:8px 4px 0}
.wbar>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.wbar span.b{width:100%;max-width:46px;background:var(--teal);border-radius:6px 6px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.chips .btn{flex-shrink:0}
.empty{padding:16px;text-align:center;color:var(--sub);font-size:13px}
textarea{width:100%;min-height:110px;font-family:var(--f-mono);font-size:11px;color:var(--ink);border:none;padding:10px;border-radius:12px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
@media (max-width:520px){h1{font-size:23px}.card{padding:14px}.days{gap:4px}}
@media (prefers-reduced-motion:no-preference){.btn,.tabs button{transition:box-shadow .15s}}
</style>

<div class="wrap">
  <header class="row between" style="align-items:flex-start">
    <div>
      <div class="eyebrow">Gaji mingguan · tagihan · tabungan</div>
      <h1>Dompet Gajian</h1>
      <div class="sub small" style="margin-top:4px">Data tersimpan otomatis di browser ini.</div>
    </div>
    <span id="saveState" class="tiny teal" aria-live="polite"></span>
  </header>
  <nav class="tabs raised" id="tabs" aria-label="Menu"></nav>
  <main id="view" class="stack" style="gap:18px"></main>
  <section class="flat card stack" id="dataBox"></section>
</div>

<script>
(function(){
/* ---------- konstanta (dari project referensi) ---------- */
const DEFAULT_TIERS=[
 {id:"gt12",label:"> 12 Bulan",harian:157743,bonus:16000,lemburBiasa:22535,lemburMerah:27302},
 {id:"9-12",label:"9–12 Bulan",harian:137376,bonus:16000,lemburBiasa:19625,lemburMerah:24102},
 {id:"5-8",label:"5–8 Bulan",harian:132376,bonus:16000,lemburBiasa:18911,lemburMerah:23316},
 {id:"1-4",label:"1–4 Bulan",harian:127376,bonus:16000,lemburBiasa:18197,lemburMerah:22531}];
const DAYS=["Kam","Jum","Sab","Min","Sen","Sel","Rab"];
const STATUS=[["hadir","Hadir"],["libur","Libur"],["lembur_merah","Lembur Merah"],["izin","Izin"],["alpha","Alpha"]];
const CATS=[["pokok","Makan & Kebutuhan","--teal"],["transport","Transportasi","--amber"],["tempat","Kos / Tempat Tinggal","--plum"],["kesehatan","Kesehatan","--coral"],["cicilan","Pay Later / Cicilan","--slate"],["tabungan","Setor Tabungan","--blue"],["lain","Lainnya","--grey"]];
const KINDS={kos:"Kos",paylater:"Pay Later",tetap:"Tagihan rutin"};
const WEEKS_PER_MONTH=52/12;
const KEY="dompet-gajian-v1", OLDKEY="ledger-state-v1";
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

/* ---------- util tanggal (pakai waktu lokal, bukan UTC) ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const mk=d=>iso(d).slice(0,7);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(key,n)=>{const[y,m]=key.split("-").map(Number);const d=new Date(y,m-1+n,1);return mk(d)};
const dim=key=>{const[y,m]=key.split("-").map(Number);return new Date(y,m,0).getDate()};
const mLabel=k=>{if(!k)return"";const[y,m]=k.split("-");return BLN[+m-1]+" "+y};
const mLong=k=>{const[y,m]=k.split("-");return BULAN[+m-1]+" "+y};
const dShort=d=>`${["Min","Sen","Sel","Rab","Kam","Jum","Sab"][d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]}`;
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
function defaultThursday(){const d=today0();return iso(addDays(d,-((d.getDay()-4+7)%7)))}

/* ---------- util angka ---------- */
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const rpk=n=>{n=Math.round(n||0);if(Math.abs(n)>=1e6)return"Rp "+(n/1e6).toLocaleString("id-ID",{maximumFractionDigits:2})+" jt";if(Math.abs(n)>=1e3)return"Rp "+Math.round(n/1e3).toLocaleString("id-ID")+" rb";return rp(n)};
const floorTo=(n,s)=>Math.max(0,Math.floor(n/s)*s);
const ceilTo=(n,s)=>Math.ceil(n/s)*s;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,-]/g,"").replace(/\./g,"").replace(",","."));return isFinite(n)?n:0};

/* ---------- state ---------- */
const emptyDay=i=>({status:i===3?"libur":"hadir",jamBiasa:0,jamMerah:0});
const newWeek=(start,tpl)=>({id:uid(),start,days:tpl?tpl.map(d=>({status:d.status,jamBiasa:0,jamMerah:0})):Array.from({length:7},(_,i)=>emptyDay(i))});
function defaultState(){const m=mk(today0());return{v:1,tierId:"gt12",tiers:JSON.parse(JSON.stringify(DEFAULT_TIERS)),weeks:[newWeek(defaultThursday())],expenses:[],joinDate:"",
  incomeManual:0,dailyLiving:40000,targetMonths:3,savingsStart:0,setoranMode:"rekomendasi",setoranAmount:0,setoranUnit:"gajian",
  bills:[{id:uid(),name:"Uang Kos",kind:"kos",amount:450000,dueDay:21,startMonth:m,tenor:0}],
  paid:{},activeMonth:m,tab:"ringkasan"}}
let S=defaultState(), ui={editBill:null,confirm:null,form:{}};
function load(){
  try{const raw=localStorage.getItem(KEY);
    if(raw){S=Object.assign(defaultState(),JSON.parse(raw));return}
    const old=localStorage.getItem(OLDKEY);
    if(old){const o=JSON.parse(old);if(o.tierId)S.tierId=o.tierId;if(Array.isArray(o.tiers)&&o.tiers.length)S.tiers=o.tiers;
      if(Array.isArray(o.weeks)&&o.weeks.length)S.weeks=o.weeks;if(Array.isArray(o.expenses))S.expenses=o.expenses;if(o.joinDate)S.joinDate=o.joinDate}
  }catch(e){}
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{const el=document.getElementById("saveState");
  try{localStorage.setItem(KEY,JSON.stringify(S));el.textContent="Tersimpan";el.className="tiny teal";setTimeout(()=>el.textContent="",1200)}
  catch(e){el.textContent="Tidak bisa menyimpan di browser ini — salin data secara berkala";el.className="tiny coral"}},400)}
function commit(){save();render()}

/* ---------- perhitungan gaji ---------- */
const rate=()=>S.tiers.find(t=>t.id===S.tierId)||S.tiers[0];
function calcWeek(w){const r=rate();let pokok=0,lembur=0,hadir=0;
  w.days.forEach(d=>{if(d.status==="hadir"){pokok+=r.harian;hadir++}lembur+=(d.jamBiasa||0)*r.lemburBiasa+(d.jamMerah||0)*r.lemburMerah});
  const bonus=r.bonus*hadir;return{pokok,lembur,bonus,hadir,total:pokok+lembur+bonus}}
const payday=w=>addDays(parse(w.start),9); // cut-off Kamis–Rabu, cair Sabtu
function incomeInfo(){
  const r=rate();
  if(S.incomeManual>0)return{monthly:S.incomeManual,weekly:S.incomeManual/WEEKS_PER_MONTH,src:"angka manual yang kamu isi"};
  const done=S.weeks.map(w=>({w,c:calcWeek(w)})).filter(x=>x.c.total>0).sort((a,b)=>a.w.start<b.w.start?-1:1).slice(-8);
  if(done.length>=2){const avg=done.reduce((a,x)=>a+x.c.total,0)/done.length;return{monthly:avg*WEEKS_PER_MONTH,weekly:avg,src:`rata-rata ${done.length} minggu tercatat`}}
  const wk=(r.harian+r.bonus)*6;return{monthly:wk*WEEKS_PER_MONTH,weekly:wk,src:`tarif ${r.label}, 6 hari kerja tanpa lembur`}
}
function monthIncome(m){return S.weeks.filter(w=>w.start.slice(0,7)===m).reduce((a,w)=>a+calcWeek(w).total,0)}
function monthExpense(m){return S.expenses.filter(e=>e.date.slice(0,7)===m).reduce((a,e)=>a+e.amount,0)}

/* ---------- tagihan ---------- */
const lastMonth=b=>b.tenor>0?addMonths(b.startMonth,b.tenor-1):null;
const active=(b,m)=>m>=b.startMonth&&(!b.tenor||m<=lastMonth(b));
const dueDate=(b,m)=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,Math.min(b.dueDay,dim(m)))};
const isPaid=(b,m)=>!!S.paid[b.id+"|"+m];
const paidCount=b=>Object.keys(S.paid).filter(k=>k.startsWith(b.id+"|")).length;
function nextOpen(b){const cur=mk(today0());for(let i=-1;i<=24;i++){const m=addMonths(cur,i);if(b.tenor&&m>lastMonth(b))return null;if(active(b,m)&&!isPaid(b,m))return m}return null}
function wajibIn(m){let kos=0,pl=0,lain=0;S.bills.forEach(b=>{if(!active(b,m))return;if(b.kind==="kos")kos+=b.amount;else if(b.kind==="paylater")pl+=b.amount;else lain+=b.amount});return{kos,pl,lain,total:kos+pl+lain}}
function saturdays(from,count){let d=new Date(from);while(d.getDay()!==6)d=addDays(d,1);return Array.from({length:count},(_,i)=>addDays(d,7*i))}

/* rencana sisihan: tiap tagihan dibagi rata ke gajian Sabtu antara jatuh tempo sebelumnya dan jatuh tempo berikutnya */
function envelopePlan(nPaydays){
  const t=today0(), pays=saturdays(t,nPaydays+10), rows=pays.slice(0,nPaydays).map(p=>({date:p,items:[],total:0})), urgent=[];
  const cur=mk(t);
  S.bills.forEach(b=>{for(let i=-1;i<=4;i++){const m=addMonths(cur,i);if(!active(b,m)||isPaid(b,m))continue;
    const D=dueDate(b,m);
    if(D<t){urgent.push({b,m,D,late:true});continue}
    const prev=dueDate(b,addMonths(m,-1)), bound=prev>addDays(t,-1)?prev:addDays(t,-1);
    const ps=pays.filter(p=>p>bound&&p<=D);
    if(!ps.length){urgent.push({b,m,D,late:false});continue}
    const share=ceilTo(b.amount/ps.length,1000);let left=b.amount;
    ps.forEach((p,j)=>{const amt=j===ps.length-1?left:Math.min(share,left);left-=amt;const row=rows.find(r=>+r.date===+p);if(row&&amt>0){row.items.push({b,amt,due:D});row.total+=amt}})
  }});
  return{rows,urgent}
}

/* ---------- rekomendasi tabungan ---------- */
function recommend(m){
  const inc=incomeInfo(), I=inc.monthly, W=wajibIn(m), H=S.dailyLiving*dim(m), sisa=I-W.total-H;
  const ideal=floorTo(I*0.2,10000), minimal=floorTo(I*0.1,10000);
  const realistis=sisa>0?Math.min(ideal,floorTo(sisa*0.7,10000)):0; // 30% sisa disimpan sebagai cadangan tak terduga
  const level=realistis>=ideal&&ideal>0?"ideal":realistis>=minimal&&minimal>0?"aman":realistis>0?"ketat":"defisit";
  const perPay=floorTo(realistis/WEEKS_PER_MONTH,5000);
  const custom=S.setoranMode==="custom"&&S.setoranAmount>0;
  const setor=custom?(S.setoranUnit==="bulan"?S.setoranAmount:Math.round(S.setoranAmount*WEEKS_PER_MONTH)):realistis;
  const setorPay=custom?(S.setoranUnit==="gajian"?S.setoranAmount:ceilTo(S.setoranAmount/WEEKS_PER_MONTH,1000)):perPay;
  return{inc,I,W,H,sisa,ideal,minimal,realistis,level,perPay,custom,setor,setorPay,bebas:sisa-setor,ratioPL:I>0?W.pl/I:0,ratioAll:I>0?(W.pl+W.lain)/I:0}
}
const savingsBalance=()=>S.savingsStart+S.expenses.filter(e=>e.category==="tabungan").reduce((a,e)=>a+e.amount,0);
const LEVEL={ideal:["Ideal tercapai","--teal"],aman:["Aman","--teal"],ketat:["Ketat","--amber"],defisit:["Defisit","--coral"]};

/* ---------- komponen kecil ---------- */
const pill=(txt,c)=>`<span class="pill" style="color:var(${c})"><span class="dot" style="--c:var(${c})"></span>${txt}</span>`;
function dueChip(D){const n=daysBetween(today0(),D);
  if(n<0)return pill(`Telat ${-n} hari`,"--coral");if(n===0)return pill("Hari ini","--coral");if(n<=3)return pill(`${n} hari lagi`,"--amber");return pill(`${n} hari lagi`,"--teal")}
const kindColor=k=>k==="kos"?"--plum":k==="paylater"?"--slate":"--grey";
function monthChips(){const set=new Set([S.activeMonth,mk(today0())]);S.weeks.forEach(w=>set.add(w.start.slice(0,7)));S.expenses.forEach(e=>set.add(e.date.slice(0,7)));
  return`<div class="chips">${[...set].sort().map(m=>`<button class="btn ${m===S.activeMonth?"on teal":""}" data-act="month" data-v="${m}">${mLabel(m)}</button>`).join("")}</div>`}

/* ---------- tampilan: Ringkasan ---------- */
function vRingkasan(){
  const m=mk(today0()), R=recommend(m), lv=LEVEL[R.level], plan=envelopePlan(6), I=R.I||1;
  const segs=[["Kos & tagihan rutin",R.W.kos+R.W.lain,"--plum"],["Pay later",R.W.pl,"--slate"],["Makan & transport",R.H,"--amber"],["Tabungan",R.setor,"--blue"],["Sisa bebas",Math.max(0,R.bebas),"--teal"]];
  const totalSeg=Math.max(I,segs.reduce((a,s)=>a+s[1],0));
  const alerts=[];

    <div class="bar" role="img" aria-label="Pembagian pendapatan bulan ini">${segs.filter(s=>s[1]>0).map(s=>`<span style="--c:var(${s[2]});width:${s[1]/totalSeg*100}%" title="${s[0]}: ${rp(s[1])}"></span>`).join("")}</div>
    <div class="legend">${segs.map(s=>`<div><span class="dot" style="--c:var(${s[2]})"></span>${s[0]}<b>${rpk(s[1])}</b></div>`).join("")}</div>

const stat=(l,v,c)=>`<div class="flat card"><div class="sub tiny" style="font-weight:600">${l}</div><div class="mono" style="font-weight:700;font-size:15px;color:var(${c})">${v}</div></div>`;
function billRow(b,m,D){
  const prog=b.tenor?`<span class="sub tiny">Cicilan ke-${Math.min(b.tenor,paidCount(b)+1)} dari ${b.tenor}</span>`:`<span class="sub tiny">Rutin tiap tanggal ${b.dueDay}</span>`;

function billCard(b){
  const m=nextOpen(b), done=b.tenor&&!m, pc=paidCount(b);
  const conf=ui.confirm==="del:"+b.id;
  const prog=b.tenor?`<div class="meter" style="margin-top:6px;max-width:260px;--c:var(--slate)"><span style="width:${Math.min(100,pc/b.tenor*100)}%"></span></div><div class="sub tiny" style="margin-top:3px">${pc} dari ${b.tenor} kali lunas · sisa ${rp(Math.max(0,b.tenor-pc)*b.amount)} · terakhir ${mLabel(lastMonth(b))}</div>`:`<div class="sub tiny">Tiap tanggal ${b.dueDay}${b.startMonth?` sejak ${mLabel(b.startMonth)}`:""}</div>`;
  const curPaid=Object.keys(S.paid).filter(k=>k.startsWith(b.id+"|")).map(k=>k.split("|")[1]).sort().slice(-1)[0];
  return`<div class="flat bill"><div class="ic pressed" style="color:var(${kindColor(b.kind)})">${b.dueDay}</div>
   <div class="main"><div class="nm">${esc(b.name)} <span class="mono sub" style="font-size:12.5px">${rp(b.amount)}/bln</span></div>${prog}</div>
   <div class="row" style="gap:8px">
    ${done?pill("Lunas semua","--teal"):`${dueChip(dueDate(b,m))}<button class="btn teal" data-act="pay" data-id="${b.id}" data-m="${m}">Lunas ${mLabel(m)}</button>`}
    ${curPaid?`<button class="link" data-act="unpay" data-id="${b.id}" data-m="${curPaid}" title="Batalkan tanda lunas ${mLabel(curPaid)}">Batal lunas ${mLabel(curPaid)}</button>`:""}
    <button class="link" data-act="editBill" data-id="${b.id}">Ubah</button>
    ${conf?`<button class="btn coral" data-act="delBill" data-id="${b.id}">Ya, hapus</button><button class="link" data-act="noconfirm">Batal</button>`:`<button class="link coral" data-act="confirm" data-v="del:${b.id}">Hapus</button>`}
   </div></div>`
}

  const f=ui.form;
  return`${monthChips()}
  <section class="raised card stack">
    <h2>Catat pengeluaran</h2>
    <div class="row" style="align-items:flex-end">
      <div class="field" style="flex-basis:180px"><label for="ex-desc">Keterangan</label><input id="ex-desc" value="${esc(f.desc||"")}" placeholder="mis. Makan siang"></div>
      <div class="field"><label for="ex-cat">Kategori</label><select id="ex-cat">${CATS.map(c=>`<option value="${c[0]}" ${(f.cat||"pokok")===c[0]?"selected":""}>${c[1]}</option>`).join("")}</select></div>
      <div class="field"><label for="ex-amt">Jumlah (Rp)</label><input id="ex-amt" type="number" min="0" value="${esc(f.amt||"")}" placeholder="25000"></div>
      <div class="field"><label for="ex-date">Tanggal</label><input id="ex-date" type="date" value="${f.date||iso(today0())}"></div>
      <button class="btn teal" data-act="addExp" style="height:40px">+ Tambah</button>
    </div><span id="ex-err" class="coral small"></span>
  </section>
  ${by.length?`<section class="flat card stack" style="gap:8px"><div class="row between"><span class="label">Per kategori · ${mLabel(m)}</span><span class="mono" style="font-weight:700">${rp(tot)}</span></div>
    ${by.map(x=>`<div><div class="row between small"><span>${x.c[1]}</span><b class="mono">${rp(x.amt)}</b></div><div class="meter" style="--c:var(${x.c[2]})"><span style="width:${x.amt/tot*100}%"></span></div></div>`).join("")}</section>`:""}
  <section class="stack" style="gap:8px">
    ${list.length?list.map(e=>{const c=CATS.find(c=>c[0]===e.category)||CATS[6];return`<div class="flat" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="min-width:0"><div style="font-weight:600">${esc(e.desc)}</div><div class="tiny sub">${dShort(parse(e.date))} · <span style="color:var(${c[2]});font-weight:600">${c[1]}</span>${e.billId?" · dari tagihan":""}</div></div>
      <div class="row" style="gap:8px;flex-wrap:nowrap"><span class="mono" style="font-weight:700;color:var(--coral)">${rp(e.amount)}</span><button class="link" data-act="delExp" data-id="${e.id}" aria-label="Hapus">✕</button></div></div>`}).join(""):`<div class="flat empty">Belum ada pengeluaran di ${mLabel(m)}.</div>`}
  </section>`
}

/* ---------- tampilan: Gaji ---------- */
function vGaji(){
  const r=rate(), m=S.activeMonth, t=today0(), cs=addDays(t,-((t.getDay()-4+7)%7)), ce=addDays(cs,6), pd=addDays(ce,3);
  const weeks=S.weeks.filter(w=>w.start.slice(0,7)===m).map(w=>({w,c:calcWeek(w)})), max=Math.max(1,...weeks.map(x=>x.c.total));
  const inc=weeks.reduce((a,x)=>a+x.c.total,0), lem=weeks.reduce((a,x)=>a+x.c.lembur,0);
  let thr="";
  if(S.joinDate){const st=parse(S.joinDate);let mo=(t.getFullYear()-st.getFullYear())*12+(t.getMonth()-st.getMonth());if(t.getDate()<st.getDate())mo--;mo=Math.max(0,mo);
    const by={};S.weeks.forEach(w=>{const c=calcWeek(w),k=w.start.slice(0,7);by[k]=(by[k]||0)+c.pokok+c.bonus});const vals=Object.values(by).filter(v=>v>0);
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:r.harian*26+r.bonus*26;
    thr=`<div class="small sub">Masa kerja <b style="color:var(--ink)">${mo} bulan</b> · ${mo>=12?"THR penuh 1× gaji bulanan":"THR proporsional (masa kerja ÷ 12)"}</div><div class="mono plum" style="font-size:18px;font-weight:700">${rp(mo>=12?avg:avg*mo/12)}</div>`}
  return`
  <div class="raised" style="padding:6px;display:flex;gap:6px;flex-wrap:wrap">${S.tiers.map(x=>`<button class="tabs-b btn ${x.id===S.tierId?"on teal":""}" style="flex:1 1 90px;justify-content:center" data-act="tier" data-v="${x.id}">${x.label}</button>`).join("")}</div>
  <section class="flat card row between">
    <div><div class="sub tiny" style="font-weight:600">Periode cut-off berjalan</div><div style="font-weight:600">${dShort(cs)} – ${dShort(ce)}</div></div>
    <div><div class="sub tiny" style="font-weight:600">Estimasi upah cair</div><div class="teal" style="font-weight:700">${dShort(pd)}</div></div>
  </section>
  ${monthChips()}
  <section class="grid3">${stat("Pendapatan "+mLabel(m),rp(inc),"--teal")}${stat("Lembur",rp(lem),"--amber")}${stat("Minggu tercatat",weeks.length+" minggu","--slate")}</section>
  ${weeks.length?`<section class="raised card"><span class="label">Pendapatan per minggu</span><div class="wbar">${weeks.map((x,i)=>`<div><span class="mono tiny">${rpk(x.c.total).replace("Rp ","")}</span><span class="b" style="height:${Math.max(4,x.c.total/max*80)}%"></span><span class="tiny sub">Mgu ${i+1}</span></div>`).join("")}</div></section>`:""}
  <h2>Absensi &amp; lembur — ${mLabel(m)}</h2>
  ${weeks.length?weeks.map((x,wi)=>{const w=x.w;return`<section class="raised card stack">
    <div class="row between"><div class="row" style="gap:8px"><b>Minggu ${wi+1}</b><input type="date" id="ws-${w.id}" value="${w.start}" data-ch="wstart" data-id="${w.id}" style="padding:5px 8px;font-size:12px"></div>
      <div class="row" style="gap:8px"><span class="mono teal" style="font-weight:700">${rp(x.c.total)}</span><span class="sub tiny">cair ${dShort(payday(w))}</span><button class="link" data-act="dupWeek" data-id="${w.id}">Duplikat</button>${S.weeks.length>1?`<button class="link coral" data-act="delWeek" data-id="${w.id}">Hapus</button>`:""}</div></div>
    <div class="days">${w.days.map((d,di)=>`<div class="flat day" style="border-radius:12px"><span class="tiny sub" style="font-weight:700">${DAYS[di]}</span>
      <select id="d-${w.id}-${di}" data-ch="dstatus" data-id="${w.id}" data-i="${di}" aria-label="Status ${DAYS[di]}" style="color:var(${d.status==="hadir"?"--teal":d.status==="lembur_merah"?"--amber":d.status==="libur"?"--sub":"--coral"})">${STATUS.map(s=>`<option value="${s[0]}" ${d.status===s[0]?"selected":""}>${s[1]}</option>`).join("")}</select>
      ${d.status==="hadir"?`<input id="jb-${w.id}-${di}" type="number" min="0" step="0.5" placeholder="0" value="${d.jamBiasa||""}" data-ch="jam" data-k="jamBiasa" data-id="${w.id}" data-i="${di}" aria-label="Jam lembur biasa ${DAYS[di]}">`:d.status==="lembur_merah"?`<input id="jm-${w.id}-${di}" type="number" min="0" step="0.5" placeholder="0" value="${d.jamMerah||""}" data-ch="jam" data-k="jamMerah" data-id="${w.id}" data-i="${di}" style="color:var(--amber)" aria-label="Jam lembur merah ${DAYS[di]}">`:`<span class="tiny sub">—</span>`}</div>`).join("")}</div>
    <div class="tiny sub row" style="gap:14px">Pokok <b style="color:var(--ink)">${rp(x.c.pokok)}</b> Lembur <b style="color:var(--ink)">${rp(x.c.lembur)}</b> Bonus hadir (${x.c.hadir} hari) <b style="color:var(--ink)">${rp(x.c.bonus)}</b></div>
  </section>`}).join(""):`<div class="flat empty">Belum ada minggu tercatat di ${mLabel(m)}.</div>`}
  <div><button class="btn teal" data-act="addWeek">+ Tambah minggu</button></div>
  <section class="raised card stack"><h2>Estimasi THR</h2>
    <div class="row"><label for="joinDate" class="sub small" style="font-weight:600">Tanggal masuk kerja</label><input type="date" id="joinDate" value="${S.joinDate}" data-ch="joinDate"></div>
    ${thr||`<div class="sub small">Isi tanggal masuk kerja untuk melihat estimasi THR.</div>`}</section>
  <section class="stack"><div class="row between"><h2>Referensi tarif</h2><div class="row"><button class="link" data-act="resetTiers">Kembalikan default</button></div></div>
   <div class="raised tbl-wrap" style="padding:4px"><table style="min-width:520px"><thead><tr><th>Masa kerja</th><th>Upah harian</th><th>Bonus hadir</th><th>Lembur biasa</th><th>Lembur merah</th></tr></thead>
   <tbody>${S.tiers.map(x=>`<tr style="${x.id===S.tierId?"background:var(--tint)":""}"><td style="font-weight:600;white-space:nowrap">${x.label}</td>${["harian","bonus","lemburBiasa","lemburMerah"].map(k=>`<td><input id="t-${x.id}-${k}" type="number" min="0" value="${x[k]}" data-ch="tier" data-id="${x.id}" data-k="${k}" style="width:100px;padding:5px 7px;font-size:12px"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <div class="sub tiny">Ubah angka sesuai slip gaji terbaru — tersimpan otomatis. Bonus hadir dihitung per hari hadir; lembur merah tidak dihitung hadir.</div></section>`
}

/* ---------- data ---------- */
function vData(){return`<div class="row between"><h2>Cadangan data</h2><span class="sub tiny">Data hanya ada di browser ini. Salin secara berkala untuk backup atau pindah HP.</span></div>
  <div class="row"><button class="btn" data-act="copyData">Salin data (JSON)</button><button class="btn" data-act="showImport">Tempel data</button>
  ${ui.confirm==="reset"?`<button class="btn coral" data-act="resetAll">Ya, hapus semua</button><button class="link" data-act="noconfirm">Batal</button>`:`<button class="btn coral" data-act="confirm" data-v="reset">Reset data</button>`}<span id="dataMsg" class="small teal"></span></div>
  ${ui.importOpen?`<textarea id="importBox" placeholder="Tempel JSON hasil salinan di sini"></textarea><div class="row"><button class="btn teal" data-act="doImport">Pulihkan data ini</button><button class="link" data-act="hideImport">Tutup</button></div>`:""}
  ${ui.copyText?`<textarea id="copyBox" readonly>${esc(ui.copyText)}</textarea>`:""}`}

/* ---------- render ---------- */
const TABS=[["ringkasan","Ringkasan"],["tagihan","Tagihan"],["tabungan","Tabungan"],["pengeluaran","Pengeluaran"],["gaji","Gaji"]];
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" data-act="tab" data-v="${k}" aria-current="${S.tab===k?"page":"false"}">${l}</button>`).join("");
  const v={ringkasan:vRingkasan,tagihan:vTagihan,tabungan:vTabungan,pengeluaran:vPengeluaran,gaji:vGaji}[S.tab]||vRingkasan;
  document.getElementById("view").innerHTML=v();
  document.getElementById("dataBox").innerHTML=vData();
}

/* ---------- aksi ---------- */
const $=id=>document.getElementById(id);
function addExpenseRec(o){const e={id:uid(),...o};S.expenses.push(e);return e}
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==="tab"){S.tab=el.dataset.v;ui.editBill=null;ui.confirm=null;commit();window.scrollTo({top:0});return}
  if(a==="month"){S.activeMonth=el.dataset.v;return commit()}
  if(a==="confirm"){ui.confirm=el.dataset.v;return render()}
  if(a==="noconfirm"){ui.confirm=null;return render()}
  if(a==="pay"){const b=S.bills.find(x=>x.id===id),m=el.dataset.m;if(!b)return;const t=iso(today0());
    const e=addExpenseRec({desc:`${b.name} ${mLabel(m)}`,amount:b.amount,date:t,category:b.kind==="kos"?"tempat":b.kind==="paylater"?"cicilan":"lain",billId:b.id});
    S.paid[b.id+"|"+m]=e.id;return commit()}
  if(a==="unpay"){const k=id+"|"+el.dataset.m,eid=S.paid[k];delete S.paid[k];S.expenses=S.expenses.filter(e=>e.id!==eid);return commit()}
  if(a==="editBill"){ui.editBill=id;render();$("billForm").scrollIntoView({behavior:"smooth"});return}
  if(a==="cancelBill"){ui.editBill=null;return render()}
  if(a==="delBill"){S.bills=S.bills.filter(b=>b.id!==id);Object.keys(S.paid).forEach(k=>{if(k.startsWith(id+"|"))delete S.paid[k]});ui.confirm=null;return commit()}
  if(a==="saveBill"){const kind=$("bf-kind").value,name=$("bf-name").value.trim(),amount=num($("bf-amount").value),dueDay=Math.round(num($("bf-day").value)),startMonth=$("bf-start").value,tenor=Math.max(0,Math.round(num($("bf-tenor").value)));
    const err=!name?"Isi nama tagihan.":amount<=0?"Isi nominal per bulan.":(dueDay<1||dueDay>31)?"Tanggal jatuh tempo harus 1–31.":!/^\d{4}-\d{2}$/.test(startMonth)?"Pilih bulan tagihan berikutnya.":(kind==="paylater"&&!tenor)?"Isi sisa berapa kali bayar untuk pay later.":"";
    if(err){$("bf-err").textContent=err;return}
    if(ui.editBill){const b=S.bills.find(x=>x.id===ui.editBill);Object.assign(b,{kind,name,amount,dueDay,startMonth,tenor})}
    else S.bills.push({id:uid(),kind,name,amount,dueDay,startMonth,tenor});
    ui.editBill=null;return commit()}
  if(a==="deposit"){const amt=num($("dp-amt").value),date=$("dp-date").value,out=$("dp-type").value==="out";
    if(amt<=0||!date){$("dp-err").textContent="Isi jumlah dan tanggal setoran.";return}
    if(out&&amt>savingsBalance()){$("dp-err").textContent=`Saldo tabungan hanya ${rp(savingsBalance())}.`;return}
    addExpenseRec({desc:out?"Ambil dari tabungan":"Setor tabungan",amount:out?-amt:amt,date,category:"tabungan"});return commit()}
  if(a==="setMode"){S.setoranMode=el.dataset.v;if(S.setoranMode==="custom"&&!S.setoranAmount){const R=recommend(mk(today0()));S.setoranAmount=R.perPay;S.setoranUnit="gajian"}return commit()}
  if(a==="quickSetor"){S.setoranAmount=+el.dataset.v;S.setoranUnit="gajian";return commit()}
  if(a==="addExp"){const desc=$("ex-desc").value.trim(),amt=num($("ex-amt").value),date=$("ex-date").value,cat=$("ex-cat").value;
    if(!desc||amt<=0||!date){ui.form={desc,amt:$("ex-amt").value,date,cat};render();$("ex-err").textContent="Isi keterangan, jumlah, dan tanggal.";return}
    addExpenseRec({desc,amount:amt,date,category:cat});ui.form={cat,date};S.activeMonth=date.slice(0,7);return commit()}
  if(a==="delExp"){const e=S.expenses.find(x=>x.id===id);if(e&&e.billId)Object.keys(S.paid).forEach(k=>{if(S.paid[k]===id)delete S.paid[k]});S.expenses=S.expenses.filter(x=>x.id!==id);return commit()}
  if(a==="tier"){S.tierId=el.dataset.v;return commit()}
  if(a==="resetTiers"){S.tiers=JSON.parse(JSON.stringify(DEFAULT_TIERS));return commit()}
  if(a==="addWeek"){const ws=S.weeks.filter(w=>w.start.slice(0,7)===S.activeMonth).sort((x,y)=>x.start<y.start?-1:1);const last=ws[ws.length-1]||S.weeks.slice().sort((x,y)=>x.start<y.start?-1:1).pop();
    const st=last?iso(addDays(parse(last.start),7)):defaultThursday();S.weeks.push(newWeek(st));S.activeMonth=st.slice(0,7);return commit()}
  if(a==="dupWeek"){const w=S.weeks.find(x=>x.id===id);const st=iso(addDays(parse(w.start),7));S.weeks.push(newWeek(st,w.days));S.activeMonth=st.slice(0,7);return commit()}
  if(a==="delWeek"){if(S.weeks.length>1)S.weeks=S.weeks.filter(w=>w.id!==id);return commit()}
  if(a==="copyData"){const txt=JSON.stringify(S);const done=()=>{const m=$("dataMsg");if(m)m.textContent="Data tersalin. Simpan di catatan atau chat ke diri sendiri."};
    try{navigator.clipboard.writeText(txt).then(done,()=>{ui.copyText=txt;render();const b=$("copyBox");b&&b.select()})}catch(e){ui.copyText=txt;render()}return}
  if(a==="showImport"){ui.importOpen=true;ui.copyText="";return render()}
  if(a==="hideImport"){ui.importOpen=false;return render()}
  if(a==="doImport"){try{const o=JSON.parse($("importBox").value);if(!o||typeof o!=="object")throw 0;
      if(o.bills||o.weeks){S=Object.assign(defaultState(),o)}else throw 0;ui.importOpen=false;commit();$("dataMsg").textContent="Data dipulihkan."}
    catch(e){$("dataMsg").textContent="";$("dataMsg").className="small coral";$("dataMsg").textContent="Teks bukan data Dompet Gajian yang valid."}return}
  if(a==="resetAll"){const tab=S.tab;S=defaultState();S.tab=tab;ui.confirm=null;try{localStorage.removeItem(KEY)}catch(e){}return commit()}
});
document.addEventListener("change",ev=>{
  const el=ev.target;const c=el.dataset&&el.dataset.ch;if(!c)return;const id=el.dataset.id,i=+el.dataset.i;
  if(c==="setoranUnit")S.setoranUnit=el.value==="bulan"?"bulan":"gajian";
  else if(["dailyLiving","incomeManual","savingsStart","setoranAmount"].includes(c))S[c]=Math.max(0,num(el.value));
  else if(c==="targetMonths")S.targetMonths=Math.min(12,Math.max(1,Math.round(num(el.value))||3));
  else if(c==="joinDate")S.joinDate=el.value;
  else if(c==="wstart"){const w=S.weeks.find(x=>x.id===id);if(w&&el.value){w.start=el.value;S.activeMonth=el.value.slice(0,7)}}
  else if(c==="dstatus"){const d=S.weeks.find(x=>x.id===id).days[i];d.status=el.value;if(d.status!=="hadir")d.jamBiasa=0;if(d.status!=="lembur_merah")d.jamMerah=0}
  else if(c==="jam"){S.weeks.find(x=>x.id===id).days[i][el.dataset.k]=Math.max(0,parseFloat(el.value)||0)}
  else if(c==="tier"){S.tiers.find(x=>x.id===id)[el.dataset.k]=Math.max(0,num(el.value))}
  commit();
});

load();
if(location.hash&&TABS.some(t=>t[0]===location.hash.slice(1)))S.tab=location.hash.slice(1);
render();
})();
</script>
</body></html>
