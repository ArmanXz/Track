<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<title>Dompet Gajian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kolom tunggal 880px, tab atas; permukaan neumorphism (timbul/tertekan) dari project referensi */
:root{
  --bg:#E7ECF3; --hi:#FFFFFF; --lo:#A9B4C6;
  --ink:#2E3947; --sub:#5F6E85;
  --teal:#2F7F6F; --coral:#C25D53; --amber:#A8742E; --plum:#7D5E9C; --slate:#5E6E82; --blue:#3E7F96; --grey:#8995A6;
  --tint:rgba(47,127,111,.10);
  --f-display:'Sora',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#222935; --hi:#2D3544; --lo:#151A22; --ink:#E4E9F1; --sub:#9AA7BA;
  --teal:#5FBBA7; --coral:#EA8E84; --amber:#E2B470; --plum:#B79AD6; --slate:#9DACBF; --blue:#73B6CC; --grey:#8C98A9;
  --tint:rgba(95,187,167,.12); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#222935; --hi:#2D3544; --lo:#151A22; --ink:#E4E9F1; --sub:#9AA7BA;
  --teal:#5FBBA7; --coral:#EA8E84; --amber:#E2B470; --plum:#B79AD6; --slate:#9DACBF; --blue:#73B6CC; --grey:#8C98A9;
  --tint:rgba(95,187,167,.12); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding:24px 16px 60px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.raised{background:var(--bg);border-radius:20px;box-shadow:8px 8px 16px var(--lo),-8px -8px 16px var(--hi)}
.flat{background:var(--bg);border-radius:14px;box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi)}
.pressed{background:var(--bg);border-radius:12px;box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)} .small{font-size:12px} .tiny{font-size:11px}
.teal{color:var(--teal)} .coral{color:var(--coral)} .amber{color:var(--amber)} .plum{color:var(--plum)}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;line-height:1.15;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);font-weight:600}
.label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--sub);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
button{font-family:var(--f-body);cursor:pointer;border:none;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{background:var(--bg);border-radius:12px;box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi);padding:9px 14px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:active,.btn.on{box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.btn.teal{color:var(--teal)} .btn.coral{color:var(--coral)}
.link{background:none;padding:2px 4px;font-size:12px;font-weight:600;color:var(--sub)}
input,select{font-family:var(--f-body);font-size:13px;color:var(--ink);border:none;padding:9px 12px;background:var(--bg);border-radius:10px;box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi);min-width:0}
input[type=number]{font-family:var(--f-mono)}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:0}
.field label{font-size:11.5px;font-weight:600;color:var(--sub)}
.tabs{display:flex;gap:6px;padding:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1 0 auto;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--sub);background:transparent;border-radius:12px}
.tabs button.on{color:var(--teal);box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--grey));flex-shrink:0}
.hero-num{font-family:var(--f-mono);font-size:clamp(26px,7vw,38px);font-weight:700;color:var(--teal);line-height:1.1}
.bar{display:flex;height:16px;border-radius:9px;overflow:hidden;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
.bar>span{display:block;height:100%;background:var(--c)}
.meter{height:8px;border-radius:5px;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--c,var(--teal));border-radius:5px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}
.legend b{margin-left:auto;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:10px 8px;text-align:left;color:var(--sub);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:700;white-space:nowrap}
td{padding:9px 8px;vertical-align:top;border-top:1px solid color-mix(in srgb,var(--lo) 35%,transparent)}
td.r,th.r{text-align:right} td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bill{padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bill .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--f-mono);font-weight:700;font-size:13px}
.bill .main{flex:1 1 180px;min-width:0}
.bill .nm{font-weight:700;font-size:14px}
.alert{padding:12px 14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.alert .dot{margin-top:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:6px}
.day select,.day input{width:100%;font-size:10px;padding:4px 2px;text-align:center;border-radius:8px}
.wbar{display:flex;align-items:flex-end;gap:10px;height:120px;padding:8px 4px 0}
.wbar>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.wbar span.b{width:100%;max-width:46px;background:var(--teal);border-radius:6px 6px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.chips .btn{flex-shrink:0}
.empty{padding:16px;text-align:center;color:var(--sub);font-size:13px}
textarea{width:100%;min-height:110px;font-family:var(--f-mono);font-size:11px;color:var(--ink);border:none;padding:10px;border-radius:12px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
[hidden]{display:none!important}
input[type=checkbox]{box-shadow:none;padding:0;width:16px;height:16px;accent-color:var(--teal)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--coral);color:var(--bg);font-size:10.5px;font-weight:700}
.mchart{display:flex;gap:10px;height:180px;padding-top:4px}
.mchart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;padding:4px 0;border-radius:10px}
.mchart .col.cur{box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.mchart .area{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.stackbar{width:70%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.stackbar span{display:block;background:var(--c);min-height:2px}
.mchart .col.cur .lbl{color:var(--teal);font-weight:700}
.slip{font-family:var(--f-mono);font-size:11.5px;line-height:1.55;white-space:pre;overflow-x:auto;min-height:0}
@media (max-width:520px){h1{font-size:23px}.card{padding:14px}.days{gap:4px}}
@media (prefers-reduced-motion:no-preference){.btn,.tabs button{transition:box-shadow .15s}}
</style>

<div class="wrap">
  <header class="row between" style="align-items:flex-start">
    <div>
      <div class="eyebrow">Gaji mingguan · tagihan · tabungan</div>
      <h1>Dompet Gajian</h1>
      <div class="sub small" style="margin-top:4px">Data tersimpan otomatis di browser ini.</div>
    </div>
    <span id="saveState" class="tiny teal" aria-live="polite"></span>
  </header>
  <nav class="tabs raised" id="tabs" aria-label="Menu"></nav>
  <main id="view" class="stack" style="gap:18px"></main>
  <section class="flat card stack" id="dataBox"></section>
</div>

<script>
(function(){
/* ---------- konstanta (dari project referensi) ---------- */
const DEFAULT_TIERS=[
 {id:"gt12",label:"> 12 Bulan",harian:157743,bonus:16000,lemburBiasa:22535,lemburMerah:27302},
 {id:"9-12",label:"9–12 Bulan",harian:137376,bonus:16000,lemburBiasa:19625,lemburMerah:24102},
 {id:"5-8",label:"5–8 Bulan",harian:132376,bonus:16000,lemburBiasa:18911,lemburMerah:23316},
 {id:"1-4",label:"1–4 Bulan",harian:127376,bonus:16000,lemburBiasa:18197,lemburMerah:22531}];
const DAYS=["Kam","Jum","Sab","Min","Sen","Sel","Rab"];
const STATUS=[["hadir","Hadir"],["libur","Libur"],["lembur_merah","Lembur Merah"],["izin","Izin"],["alpha","Alpha"]];
const CATS=[["pokok","Makan & Kebutuhan","--teal"],["transport","Transportasi","--amber"],["tempat","Kos / Tempat Tinggal","--plum"],["kesehatan","Kesehatan","--coral"],["cicilan","Pay Later / Cicilan","--slate"],["tabungan","Setor Tabungan","--blue"],["lain","Lainnya","--grey"]];
const KINDS={kos:"Kos",paylater:"Pay Later",tetap:"Tagihan rutin"};
const WEEKS_PER_MONTH=52/12;
const KEY="dompet-gajian-v1", OLDKEY="ledger-state-v1";
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

/* ---------- util tanggal (pakai waktu lokal, bukan UTC) ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const mk=d=>iso(d).slice(0,7);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(key,n)=>{const[y,m]=key.split("-").map(Number);const d=new Date(y,m-1+n,1);return mk(d)};
const dim=key=>{const[y,m]=key.split("-").map(Number);return new Date(y,m,0).getDate()};
const mLabel=k=>{if(!k)return"";const[y,m]=k.split("-");return BLN[+m-1]+" "+y};
const mLong=k=>{const[y,m]=k.split("-");return BULAN[+m-1]+" "+y};
const dShort=d=>`${["Min","Sen","Sel","Rab","Kam","Jum","Sab"][d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]}`;
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
function defaultThursday(){const d=today0();return iso(addDays(d,-((d.getDay()-4+7)%7)))}

/* ---------- util angka ---------- */
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const rpk=n=>{n=Math.round(n||0);if(Math.abs(n)>=1e6)return"Rp "+(n/1e6).toLocaleString("id-ID",{maximumFractionDigits:2})+" jt";if(Math.abs(n)>=1e3)return"Rp "+Math.round(n/1e3).toLocaleString("id-ID")+" rb";return rp(n)};
const floorTo=(n,s)=>Math.max(0,Math.floor(n/s)*s);
const ceilTo=(n,s)=>Math.ceil(n/s)*s;
const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,-]/g,"").replace(/\./g,"").replace(",","."));return isFinite(n)?n:0};

/* ---------- state ---------- */
const emptyDay=i=>({status:i===3?"libur":"hadir",jamBiasa:0,jamMerah:0});
const newWeek=(start,tpl)=>({id:uid(),start,days:tpl?tpl.map(d=>({status:d.status,jamBiasa:0,jamMerah:0})):Array.from({length:7},(_,i)=>emptyDay(i))});
function defaultState(){const m=mk(today0());return{v:2,tierId:"gt12",tiers:JSON.parse(JSON.stringify(DEFAULT_TIERS)),weeks:[newWeek(defaultThursday())],expenses:[],joinDate:"",
  incomeManual:0,dailyLiving:40000,targetMonths:3,savingsStart:0,setoranMode:"rekomendasi",setoranAmount:0,setoranUnit:"gajian",saldoAdj:{},saldoAdjNow:{},carryOver:false,remindDays:3,recurring:[],recurGen:{},budgets:{},goals:[],
  bills:[{id:uid(),name:"Uang Kos",kind:"kos",amount:450000,dueDay:21,startMonth:m,tenor:0}],
  paid:{},activeMonth:m,tab:"ringkasan"}}
let S=defaultState(), ui={editBill:null,confirm:null,form:{},editDay:null,editSaldo:null,editGoal:null,slip:null,flash:""};
function load(){
  try{const raw=localStorage.getItem(KEY);
    if(raw){S=Object.assign(defaultState(),JSON.parse(raw));if((S.v||1)<2){S.carryOver=false;S.v=2}return}
    const old=localStorage.getItem(OLDKEY);
    if(old){const o=JSON.parse(old);if(o.tierId)S.tierId=o.tierId;if(Array.isArray(o.tiers)&&o.tiers.length)S.tiers=o.tiers;
      if(Array.isArray(o.weeks)&&o.weeks.length)S.weeks=o.weeks;if(Array.isArray(o.expenses))S.expenses=o.expenses;if(o.joinDate)S.joinDate=o.joinDate}
  }catch(e){}
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{const el=document.getElementById("saveState");
  try{localStorage.setItem(KEY,JSON.stringify(S));el.textContent="Tersimpan";el.className="tiny teal";setTimeout(()=>el.textContent="",1200)}
  catch(e){el.textContent="Tidak bisa menyimpan di browser ini — salin data secara berkala";el.className="tiny coral"}},400)}
function commit(){save();render()}

/* ---------- perhitungan gaji ---------- */
const rate=()=>S.tiers.find(t=>t.id===S.tierId)||S.tiers[0];
function calcWeek(w){const r=rate();let pokok=0,lembur=0,hadir=0;
  w.days.forEach(d=>{if(d.status==="hadir"){pokok+=r.harian;hadir++}lembur+=(d.jamBiasa||0)*r.lemburBiasa+(d.jamMerah||0)*r.lemburMerah});
  const bonus=r.bonus*hadir;return{pokok,lembur,bonus,hadir,total:pokok+lembur+bonus}}
const payday=w=>addDays(parse(w.start),9); // cut-off Kamis–Rabu, cair Sabtu
function incomeInfo(){
  const r=rate();
  if(S.incomeManual>0)return{monthly:S.incomeManual,weekly:S.incomeManual/WEEKS_PER_MONTH,src:"angka manual yang kamu isi"};
  const done=S.weeks.map(w=>({w,c:calcWeek(w)})).filter(x=>x.c.total>0).sort((a,b)=>a.w.start<b.w.start?-1:1).slice(-8);
  if(done.length>=2){const avg=done.reduce((a,x)=>a+x.c.total,0)/done.length;return{monthly:avg*WEEKS_PER_MONTH,weekly:avg,src:`rata-rata ${done.length} minggu tercatat`}}
  const wk=(r.harian+r.bonus)*6;return{monthly:wk*WEEKS_PER_MONTH,weekly:wk,src:`tarif ${r.label}, 6 hari kerja tanpa lembur`}
}
function monthIncome(m){return S.weeks.filter(w=>w.start.slice(0,7)===m).reduce((a,w)=>a+calcWeek(w).total,0)}
function monthExpense(m){return S.expenses.filter(e=>e.date.slice(0,7)===m).reduce((a,e)=>a+e.amount,0)}

/* ---------- tagihan ---------- */
const lastMonth=b=>b.tenor>0?addMonths(b.startMonth,b.tenor-1):null;
const active=(b,m)=>m>=b.startMonth&&(!b.tenor||m<=lastMonth(b));
const dueDate=(b,m)=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,Math.min(b.dueDay,dim(m)))};
const isPaid=(b,m)=>!!S.paid[b.id+"|"+m];
const paidCount=b=>Object.keys(S.paid).filter(k=>k.startsWith(b.id+"|")).length;
function nextOpen(b){const cur=mk(today0());for(let i=-1;i<=24;i++){const m=addMonths(cur,i);if(b.tenor&&m>lastMonth(b))return null;if(active(b,m)&&!isPaid(b,m))return m}return null}
function wajibIn(m){let kos=0,pl=0,lain=0;S.bills.forEach(b=>{if(!active(b,m))return;if(b.kind==="kos")kos+=b.amount;else if(b.kind==="paylater")pl+=b.amount;else lain+=b.amount});return{kos,pl,lain,total:kos+pl+lain}}
function saturdays(from,count){let d=new Date(from);while(d.getDay()!==6)d=addDays(d,1);return Array.from({length:count},(_,i)=>addDays(d,7*i))}

/* rencana sisihan: tiap tagihan dibagi rata ke gajian Sabtu antara jatuh tempo sebelumnya dan jatuh tempo berikutnya */
function envelopePlan(nPaydays){
  const t=today0(), pays=saturdays(t,nPaydays+10), rows=pays.slice(0,nPaydays).map(p=>({date:p,items:[],total:0})), urgent=[];
  const cur=mk(t);
  S.bills.forEach(b=>{for(let i=-1;i<=4;i++){const m=addMonths(cur,i);if(!active(b,m)||isPaid(b,m))continue;
    const D=dueDate(b,m);
    if(D<t){urgent.push({b,m,D,late:true});continue}
    const prev=dueDate(b,addMonths(m,-1)), bound=prev>addDays(t,-1)?prev:addDays(t,-1);
    const ps=pays.filter(p=>p>bound&&p<=D);
    if(!ps.length){urgent.push({b,m,D,late:false});continue}
    const share=ceilTo(b.amount/ps.length,1000);let left=b.amount;
    ps.forEach((p,j)=>{const amt=j===ps.length-1?left:Math.min(share,left);left-=amt;const row=rows.find(r=>+r.date===+p);if(row&&amt>0){row.items.push({b,amt,due:D});row.total+=amt}})
  }});
  return{rows,urgent}
}

/* ---------- rekomendasi tabungan ---------- */
function recommend(m){
  const inc=incomeInfo(), I=inc.monthly, W=wajibIn(m), H=S.dailyLiving*dim(m), sisa=I-W.total-H;
  const ideal=floorTo(I*0.2,10000), minimal=floorTo(I*0.1,10000);
  const realistis=sisa>0?Math.min(ideal,floorTo(sisa*0.7,10000)):0; // 30% sisa disimpan sebagai cadangan tak terduga
  const level=realistis>=ideal&&ideal>0?"ideal":realistis>=minimal&&minimal>0?"aman":realistis>0?"ketat":"defisit";
  const perPay=floorTo(realistis/WEEKS_PER_MONTH,5000);
  const custom=S.setoranMode==="custom"&&S.setoranAmount>0;
  const setor=custom?(S.setoranUnit==="bulan"?S.setoranAmount:Math.round(S.setoranAmount*WEEKS_PER_MONTH)):realistis;
  const setorPay=custom?(S.setoranUnit==="gajian"?S.setoranAmount:ceilTo(S.setoranAmount/WEEKS_PER_MONTH,1000)):perPay;
  return{inc,I,W,H,sisa,ideal,minimal,realistis,level,perPay,custom,setor,setorPay,bebas:sisa-setor,ratioPL:I>0?W.pl/I:0,ratioAll:I>0?(W.pl+W.lain)/I:0}
}
const savingsBalance=()=>S.savingsStart+S.expenses.filter(e=>e.category==="tabungan").reduce((a,e)=>a+e.amount,0);
/* target tabungan */
const goalSaved=gid=>S.expenses.filter(e=>e.category==="tabungan"&&(e.goalId||"")===gid).reduce((a,e)=>a+e.amount,0);
const emergencyBal=()=>S.savingsStart+goalSaved("");
function paysUntil(d){let n=0;for(const p of saturdays(today0(),800)){if(p>d)break;n++}return n}
function goalPlan(perPay){
  const gs=(S.goals||[]).map(g=>{const saved=goalSaved(g.id),rem=Math.max(0,g.target-saved),dl=g.deadline?parse(g.deadline):null,n=dl?paysUntil(dl):0,need=rem>0&&dl?(n>0?ceilTo(rem/n,1000):rem):0;return{g,saved,rem,dl,n,need,alloc:0}});
  const totalNeed=gs.reduce((a,x)=>a+x.need,0),scale=totalNeed>perPay&&totalNeed>0?perPay/totalNeed:1;
  gs.forEach(x=>x.alloc=Math.min(x.rem,floorTo(x.need*scale,1000)));
  let left=perPay-gs.reduce((a,x)=>a+x.alloc,0);
  const open=gs.filter(x=>!x.dl&&x.rem>0),share=open.length?floorTo(left/(open.length+1),1000):0;
  open.forEach(x=>x.alloc=Math.min(x.rem,share));
  left=perPay-gs.reduce((a,x)=>a+x.alloc,0);
  return{gs,totalNeed,emergency:Math.max(0,left)}}
/* pengingat */
function reminders(){const t=today0();return S.bills.map(b=>{const m=nextOpen(b);if(!m)return null;const D=dueDate(b,m),n=daysBetween(t,D);return n<=S.remindDays?{b,m,D,n}:null}).filter(Boolean).sort((a,b)=>a.D-b.D)}
/* pengeluaran rutin */
const WDAY=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
function recurDates(r,until){const out=[],st=parse(r.start);
  if(r.freq==="mingguan"){let d=new Date(st);while(d.getDay()!==r.day)d=addDays(d,1);for(;d<=until;d=addDays(d,7))out.push(new Date(d))}
  else{const m0=mk(st);for(let i=0;i<600;i++){const k=addMonths(m0,i),x=new Date(+k.slice(0,4),+k.slice(5,7)-1,Math.min(r.day,dim(k)));if(x>until)break;if(x>=st)out.push(x)}}
  return out}
const nextRecur=r=>{const t=today0();return recurDates(r,addDays(t,62)).find(d=>d>t)||null};
function runRecurring(){const t=today0();let n=0;
  (S.recurring||[]).forEach(r=>{if(r.paused)return;recurDates(r,t).forEach(d=>{const k=r.id+"|"+iso(d);if(S.recurGen[k])return;
    const e=addExpenseRec({desc:r.desc,amount:r.amount,date:iso(d),category:r.category,recurId:r.id});S.recurGen[k]=e.id;n++})});return n}
/* batas belanja: minggu = gajian Sabtu s/d Jumat */
function weekWindow(){const t=today0(),s=addDays(t,-((t.getDay()-6+7)%7));return[s,addDays(s,6)]}
function budgetStatus(){const t=today0(),[ws,we]=weekWindow(),ms=new Date(t.getFullYear(),t.getMonth(),1),me=new Date(t.getFullYear(),t.getMonth()+1,0);
  return Object.entries(S.budgets||{}).map(([cat,b])=>{const from=b.period==="minggu"?ws:ms,to=b.period==="minggu"?we:me;
    const spent=S.expenses.filter(e=>e.category===cat&&e.amount>0).filter(e=>{const d=parse(e.date);return d>=from&&d<=to}).reduce((a,e)=>a+e.amount,0);
    return{cat,c:CATS.find(c=>c[0]===cat)||CATS[6],amount:b.amount,period:b.period,from,to,spent,pct:b.amount>0?spent/b.amount:0}})}
const LEVEL={ideal:["Ideal tercapai","--teal"],aman:["Aman","--teal"],ketat:["Ketat","--amber"],defisit:["Defisit","--coral"]};

function dueChip(D){const n=daysBetween(today0(),D);
  if(n<0)return pill(`Telat ${-n} hari`,"--coral");if(n===0)return pill("Hari ini","--coral");if(n<=S.remindDays)return pill(`${n} hari lagi`,"--amber");return pill(`${n} hari lagi`,"--teal")}
const kindColor=k=>k==="kos"?"--plum":k==="paylater"?"--slate":"--grey";
function monthChips(){const set=new Set([S.activeMonth,mk(today0())]);S.weeks.forEach(w=>set.add(w.start.slice(0,7)));S.expenses.forEach(e=>set.add(e.date.slice(0,7)));
  return`<div class="chips">${[...set].sort().map(m=>`<button class="btn ${m===S.activeMonth?"on teal":""}" data-act="month" data-v="${m}">${mLabel(m)}</button>`).join("")}</div>`}

/* saldo per hari ini: hanya bulan berjalan, gaji dihitung saat cair, pengeluaran s/d hari ini */
function nowStats(){const t=today0(),m=mk(t),ti=iso(t);
  const inc=S.weeks.filter(w=>{const p=payday(w);return mk(p)===m&&p<=t}).reduce((a,w)=>a+calcWeek(w).total,0);

  const next=S.weeks.map(w=>({w,p:payday(w)})).filter(x=>x.p>t).sort((a,b)=>a.p-b.p)[0];
  return{t,m,inc,exp,adj,base:inc-exp,saldo:inc-exp+adj,next}}

function billCard(b){

  const conf=ui.confirm==="del:"+b.id;

  </section>

  <section class="grid3">

    ${lv("Ideal 20%",R.ideal,"aturan 50/30/20","--teal",R.sisa*0.7>=R.ideal)}
  </section>

  <section class="raised card stack">
    <h2>Proyeksi 6 bulan</h2>
    <div class="tbl-wrap"><table style="min-width:480px"><thead><tr><th>Bulan</th><th class="r">Tagihan wajib</th><th class="r">${R.custom?"Setoran pilihanmu":"Tabungan realistis"}</th><th class="r">Akumulasi</th></tr></thead>
    <tbody>${proj.map(p=>`<tr><td style="font-weight:600;white-space:nowrap">${mLabel(p.m)}${p.ends.length?`<div class="tiny teal">${p.ends.map(b=>esc(b.name)).join(", ")} lunas</div>`:""}</td><td class="r">${rp(p.r.W.total)}</td><td class="r" style="color:var(${p.r.bebas<0?"--coral":"--blue"});font-weight:700">${rp(p.r.setor)}</td><td class="r">${rp(p.acc)}</td></tr>`).join("")}</tbody></table></div>
    <div class="sub tiny">Bulan setelah pay later lunas, cicilannya otomatis pindah jadi ruang tabungan.</div>
  </section>

  <section class="flat card stack">
    <h2>Pengaturan perhitungan</h2>
    <div class="row" style="align-items:flex-end">
      <div class="field"><label for="st-living">Makan &amp; transport per hari (Rp)</label><input id="st-living" type="number" min="0" step="5000" value="${S.dailyLiving}" data-ch="dailyLiving"></div>
      <div class="field"><label for="st-income">Pendapatan per bulan (Rp, 0 = otomatis)</label><input id="st-income" type="number" min="0" value="${S.incomeManual||0}" data-ch="incomeManual"></div>

}

   <div class="field"><label for="gl-amt">Jumlah target (Rp)</label><input id="gl-amt" type="number" min="0" step="50000" value="${e?e.target:""}" placeholder="2000000"></div>
   <div class="field"><label for="gl-date">Tenggat (opsional)</label><input id="gl-date" type="date" value="${e?e.deadline||"":""}"></div>

/* ---------- tampilan: Pengeluaran ---------- */

function budgetSection(){const st=budgetStatus();
  return`<section class="raised card stack" id="budgetBox"><div><h2>Batas belanja</h2><div class="sub small" style="margin-top:2px">Minggu dihitung dari gajian Sabtu sampai Jumat. Bulan dihitung kalender.</div></div>
  ${st.length?st.map(x=>{const col=x.pct>=1?"--coral":x.pct>=0.8?"--amber":"--teal",cf=ui.confirm==="bg-del:"+x.cat,daysLeft=daysBetween(today0(),x.to)+1;
   return`<div class="stack" style="gap:4px"><div class="row between small"><span><span class="dot" style="--c:var(${x.c[2]});display:inline-block;margin-right:6px"></span><b>${x.c[1]}</b> <span class="sub tiny">${x.period==="minggu"?`${x.from.getDate()} ${BLN[x.from.getMonth()]}–${x.to.getDate()} ${BLN[x.to.getMonth()]}`:"bulan ini"}</span></span>
   <span class="row" style="gap:6px"><b class="mono" style="color:var(${col})">${rp(x.spent)}</b><span class="sub tiny mono">/ ${rp(x.amount)}</span>${cf?`<button class="btn coral" data-act="delBudget" data-v="${x.cat}" style="padding:4px 10px">Hapus</button><button class="link" data-act="noconfirm">Batal</button>`:`<button class="link coral" data-act="confirm" data-v="bg-del:${x.cat}" aria-label="Hapus batas ${x.c[1]}">✕</button>`}</span></div>

   <div class="tiny" style="color:var(${col})">${x.pct>=1?`Lewat ${rp(x.spent-x.amount)}`:`Sisa ${rp(x.amount-x.spent)} · sekitar ${rp(floorTo((x.amount-x.spent)/Math.max(1,daysLeft),1000))} per hari untuk ${daysLeft} hari lagi`}</div></div>`}).join(""):`<div class="sub small">Belum ada batas. Contoh: makan Rp280.000 per minggu gajian.</div>`}
  <div class="row" style="align-items:flex-end">
   <div class="field"><label for="bg-cat">Kategori</label><select id="bg-cat">${CATS.filter(c=>!["tabungan","tempat","cicilan"].includes(c[0])).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select></div>
   <div class="field"><label for="bg-amt">Batas (Rp)</label><input id="bg-amt" type="number" min="0" step="10000" placeholder="${S.dailyLiving*7}"></div>
   <div class="field"><label for="bg-per">Per</label><select id="bg-per"><option value="minggu">Minggu gajian</option><option value="bulan">Bulan</option></select></div>
   <button class="btn teal" data-act="saveBudget" style="height:40px">Simpan batas</button>
  </div><span id="bg-err" class="coral small"></span>
  <div class="sub tiny">Simpan lagi untuk kategori yang sama kalau mau mengubah batasnya.</div></section>`}
function chartSection(m){const months=Array.from({length:6},(_,i)=>addMonths(m,i-5)),cats=CATS.filter(c=>c[0]!=="tabungan");
  const data=months.map(k=>{const by={};S.expenses.forEach(e=>{const c=e.category||"lain";if(e.date.slice(0,7)===k&&c!=="tabungan"&&e.amount>0)by[c]=(by[c]||0)+e.amount});return{k,by,tot:Object.values(by).reduce((a,b)=>a+b,0)}});
  const max=Math.max(1,...data.map(d=>d.tot)),used=cats.filter(c=>data.some(d=>d.by[c[0]]));
  if(!used.length)return`<section class="raised card stack"><h2>Pengeluaran 6 bulan</h2><div class="sub small">Grafik muncul setelah ada pengeluaran tercatat.</div></section>`;
  const cur=data[5],prev=data[4];let insight="";
  if(prev.tot>0){const diff=cur.tot-prev.tot;insight=diff===0?`Total ${mLabel(cur.k)} sama dengan ${mLabel(prev.k)} (${rp(cur.tot)}).`:`Total ${mLabel(cur.k)} ${diff>0?"naik":"turun"} ${Math.round(Math.abs(diff)/prev.tot*100)}% dari ${mLabel(prev.k)} (${rp(prev.tot)} → ${rp(cur.tot)}).`;

      ${d.status==="hadir"?`<input id="jb-${w.id}-${di}" type="number" min="0" step="0.5" placeholder="0" value="${d.jamBiasa||""}" data-ch="jam" data-k="jamBiasa" data-id="${w.id}" data-i="${di}" aria-label="Jam lembur biasa ${DAYS[di]}">`:d.status==="lembur_merah"?`<input id="jm-${w.id}-${di}" type="number" min="0" step="0.5" placeholder="0" value="${d.jamMerah||""}" data-ch="jam" data-k="jamMerah" data-id="${w.id}" data-i="${di}" style="color:var(--amber)" aria-label="Jam lembur merah ${DAYS[di]}">`:`<span class="tiny sub">—</span>`}</div>`).join("")}</div>

}

function slipText(w){const r=rate(),c=calcWeek(w),st=parse(w.start),en=addDays(st,6),pd=payday(w);
  const jb=w.days.reduce((a,d)=>a+(d.jamBiasa||0),0),jm=w.days.reduce((a,d)=>a+(d.jamMerah||0),0),line="-".repeat(40);
  const L=["SLIP GAJI MINGGUAN",`Periode : ${dShort(st)} – ${dShort(en)} ${en.getFullYear()}`,`Cair    : ${dShort(pd)} ${pd.getFullYear()}`,`Tarif   : ${r.label}`,line,
    `Upah pokok   ${c.hadir} hari × ${rp(r.harian)}`,`             = ${rp(c.pokok)}`,
    `Bonus hadir  ${c.hadir} hari × ${rp(r.bonus)}`,`             = ${rp(c.bonus)}`];
  if(jb)L.push(`Lembur biasa ${jb} jam × ${rp(r.lemburBiasa)}`,`             = ${rp(jb*r.lemburBiasa)}`);
  if(jm)L.push(`Lembur merah ${jm} jam × ${rp(r.lemburMerah)}`,`             = ${rp(jm*r.lemburMerah)}`);
  L.push(line,`TOTAL        ${rp(c.total)}`,"","Rincian harian:");
  w.days.forEach((d,i)=>{const dt=addDays(st,i),s=(STATUS.find(x=>x[0]===d.status)||[0,d.status])[1],j=(d.jamBiasa||0)+(d.jamMerah||0);
    L.push(`${dShort(dt).padEnd(12)} ${s}${j?` +${j} jam`:""}${d.note?` (${d.note})`:""}`)});
  return L.join("\n")}
function dayEditor(w,i){const d=w.days[i],dt=addDays(parse(w.start),i),cf=ui.confirm==="day:"+w.id+":"+i;

    </div>
    <div class="field" style="flex:none"><label for="de-note">Catatan (opsional)</label><input id="de-note" value="${esc(d.note||"")}" placeholder="mis. lembur bongkar muat"></div>

    <div class="row" style="gap:8px"><button class="btn teal" data-act="saveDay" data-id="${w.id}" data-i="${i}">Simpan</button>
      ${cf?`<button class="btn coral" data-act="clearDay" data-id="${w.id}" data-i="${i}">Ya, hapus isian</button><button class="link" data-act="noconfirm">Batal</button>`:`<button class="link coral" data-act="confirm" data-v="day:${w.id}:${i}">Hapus isian tanggal ini</button>`}</div>
    <span id="de-err" class="coral small"></span></div>`}
function rincian(m){const r=rate(),rows=[];
  S.weeks.forEach(w=>w.days.forEach((d,i)=>{const dt=addDays(parse(w.start),i);if(mk(dt)!==m)return;
    if((d.jamBiasa||0)>0||(d.jamMerah||0)>0||["izin","alpha","lembur_merah"].includes(d.status)||d.note)rows.push({w,i,d,dt})}));
  rows.sort((a,b)=>a.dt-b.dt);
  const tot=rows.reduce((a,x)=>a+(x.d.jamBiasa||0)*r.lemburBiasa+(x.d.jamMerah||0)*r.lemburMerah,0);
  return`<section class="raised card stack"><div class="row between"><h2>Rincian lembur &amp; absensi — ${mLabel(m)}</h2><span class="mono amber" style="font-weight:700">${rp(tot)}</span></div>
  ${rows.length?`<div class="tbl-wrap"><table style="min-width:460px"><thead><tr><th>Tanggal</th><th>Status</th><th class="r">Jam</th><th class="r">Upah lembur</th><th></th></tr></thead><tbody>
  ${rows.map(x=>{const jam=(x.d.jamBiasa||0)+(x.d.jamMerah||0),up=(x.d.jamBiasa||0)*r.lemburBiasa+(x.d.jamMerah||0)*r.lemburMerah,st=STATUS.find(s=>s[0]===x.d.status),k=x.w.id+":"+x.i;
    return`<tr><td style="white-space:nowrap;font-weight:600">${dShort(x.dt)}${x.d.note?`<div class="tiny sub" style="font-weight:400">${esc(x.d.note)}</div>`:""}</td>
    <td>${pill(st?st[1]:x.d.status,x.d.status==="hadir"?"--teal":x.d.status==="lembur_merah"?"--amber":"--coral")}</td><td class="r">${jam||"—"}</td><td class="r">${up?rp(up):"—"}</td>
    <td style="white-space:nowrap;text-align:right"><button class="link" data-act="editDay" data-id="${x.w.id}" data-i="${x.i}">Ubah</button>${ui.confirm==="rc:"+k?`<button class="btn coral" data-act="clearDay" data-id="${x.w.id}" data-i="${x.i}" style="padding:5px 10px">Hapus</button><button class="link" data-act="noconfirm">Batal</button>`:`<button class="link coral" data-act="confirm" data-v="rc:${k}">Hapus</button>`}</td></tr>`}).join("")}
  </tbody></table></div>`:`<div class="sub small">Belum ada lembur, izin, atau alpha tercatat di ${mLabel(m)}.</div>`}
  <div class="sub tiny">Hapus = kembalikan tanggal itu ke status normal tanpa lembur (Minggu jadi Libur, hari lain Hadir).</div></section>`}

const $=id=>document.getElementById(id);
function addExpenseRec(o){const e={id:uid(),...o};S.expenses.push(e);return e}
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==="tab"){S.tab=el.dataset.v;ui.editBill=null;ui.confirm=null;ui.editDay=null;ui.editSaldo=null;ui.editGoal=null;ui.slip=null;commit();window.scrollTo({top:0});return}
  if(a==="month"){S.activeMonth=el.dataset.v;return commit()}
  if(a==="confirm"){ui.confirm=el.dataset.v;return render()}
  if(a==="noconfirm"){ui.confirm=null;return render()}
  if(a==="pay"){const b=S.bills.find(x=>x.id===id),m=el.dataset.m;if(!b)return;const t=iso(today0());
    const e=addExpenseRec({desc:`${b.name} ${mLabel(m)}`,amount:b.amount,date:t,category:b.kind==="kos"?"tempat":b.kind==="paylater"?"cicilan":"lain",billId:b.id});
    S.paid[b.id+"|"+m]=e.id;return commit()}
  if(a==="unpay"){const k=id+"|"+el.dataset.m,eid=S.paid[k];delete S.paid[k];S.expenses=S.expenses.filter(e=>e.id!==eid);return commit()}
  if(a==="editBill"){ui.editBill=id;render();$("billForm").scrollIntoView({behavior:"smooth"});return}
  if(a==="cancelBill"){ui.editBill=null;return render()}
  if(a==="delBill"){S.bills=S.bills.filter(b=>b.id!==id);Object.keys(S.paid).forEach(k=>{if(k.startsWith(id+"|"))delete S.paid[k]});ui.confirm=null;return commit()}
  if(a==="saveBill"){const kind=$("bf-kind").value,name=$("bf-name").value.trim(),amount=num($("bf-amount").value),dueDay=Math.round(num($("bf-day").value)),startMonth=$("bf-start").value,tenor=Math.max(0,Math.round(num($("bf-tenor").value)));
    const err=!name?"Isi nama tagihan.":amount<=0?"Isi nominal per bulan.":(dueDay<1||dueDay>31)?"Tanggal jatuh tempo harus 1–31.":!/^\d{4}-\d{2}$/.test(startMonth)?"Pilih bulan tagihan berikutnya.":(kind==="paylater"&&!tenor)?"Isi sisa berapa kali bayar untuk pay later.":"";
    if(err){$("bf-err").textContent=err;return}
    if(ui.editBill){const b=S.bills.find(x=>x.id===ui.editBill);Object.assign(b,{kind,name,amount,dueDay,startMonth,tenor})}
    else S.bills.push({id:uid(),kind,name,amount,dueDay,startMonth,tenor});
    ui.editBill=null;return commit()}
  if(a==="deposit"){const amt=num($("dp-amt").value),date=$("dp-date").value,out=$("dp-type").value==="out",gid=$("dp-goal").value,g=(S.goals||[]).find(x=>x.id===gid);
    if(amt<=0||!date){$("dp-err").textContent="Isi jumlah dan tanggal setoran.";return}
    const avail=gid?goalSaved(gid):emergencyBal();
    if(out&&amt>avail){$("dp-err").textContent=`Saldo ${g?esc(g.name):"dana darurat"} hanya ${rp(avail)}.`;return}
    const rec={desc:(out?"Ambil dari tabungan":"Setor tabungan")+(g?" · "+g.name:""),amount:out?-amt:amt,date,category:"tabungan"};if(gid)rec.goalId=gid;
    addExpenseRec(rec);return commit()}
  if(a==="saveGoal"){const name=$("gl-name").value.trim(),target=num($("gl-amt").value),deadline=$("gl-date").value;
    const err=!name?"Isi nama target.":target<=0?"Isi jumlah target.":(!ui.editGoal&&deadline&&parse(deadline)<today0())?"Tenggat sudah lewat.":"";
    if(err){$("gl-err").textContent=err;return}
    if(ui.editGoal){const g=S.goals.find(x=>x.id===ui.editGoal);if(g)Object.assign(g,{name,target,deadline})}else S.goals.push({id:uid(),name,target,deadline});
    ui.editGoal=null;return commit()}
  if(a==="editGoal"){ui.editGoal=id;render();const f=$("gl-name");f&&f.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(a==="cancelGoal"){ui.editGoal=null;return render()}
  if(a==="delGoal"){S.goals=S.goals.filter(g=>g.id!==id);S.expenses.forEach(e=>{if(e.goalId===id)delete e.goalId});ui.confirm=null;if(ui.editGoal===id)ui.editGoal=null;return commit()}
  if(a==="setRemind"){S.remindDays=+el.dataset.v;return commit()}
  if(a==="saveBudget"){const cat=$("bg-cat").value,amount=num($("bg-amt").value),period=$("bg-per").value;
    if(amount<=0){$("bg-err").textContent="Isi batas belanja.";return}
    S.budgets[cat]={amount,period};return commit()}
  if(a==="delBudget"){delete S.budgets[el.dataset.v];ui.confirm=null;return commit()}
  if(a==="saveRecur"){const desc=$("rf-desc").value.trim(),amount=num($("rf-amt").value),category=$("rf-cat").value,freq=$("rf-freq").value,start=$("rf-start").value;
    const day=freq==="mingguan"?+$("rf-wday").value:Math.round(num($("rf-date").value));
    const err=!desc?"Isi keterangan.":amount<=0?"Isi jumlah.":(freq==="bulanan"&&(day<1||day>31))?"Tanggal harus 1–31.":!start?"Pilih tanggal mulai.":"";
    if(err){$("rf-err").textContent=err;return}
    S.recurring.push({id:uid(),desc,amount,category,freq,day,start});const n=runRecurring();
    ui.flash=n?`${n} pengeluaran rutin yang jadwalnya sudah lewat langsung dicatat.`:"Pengeluaran rutin disimpan.";return commit()}
  if(a==="toggleRecur"){const r=S.recurring.find(x=>x.id===id);if(r){r.paused=!r.paused;if(!r.paused)r.start=iso(today0())}runRecurring();return commit()}
  if(a==="delRecur"){S.recurring=S.recurring.filter(r=>r.id!==id);ui.confirm=null;return commit()}
  if(a==="slip"){ui.slip=ui.slip===id?null:id;return render()}
  if(a==="copySlip"){const w=S.weeks.find(x=>x.id===id);if(!w)return;const txt=slipText(w),msg=$("slipMsg");
    const fb=()=>{const b=$("slipBox");if(b){b.focus();b.select()}if(msg)msg.textContent="Teks sudah dipilih, salin lewat menu HP."};
    try{navigator.clipboard.writeText(txt).then(()=>{if(msg)msg.textContent="Slip tersalin."},fb)}catch(e){fb()}return}
  if(a==="setMode"){S.setoranMode=el.dataset.v;if(S.setoranMode==="custom"&&!S.setoranAmount){const R=recommend(mk(today0()));S.setoranAmount=R.perPay;S.setoranUnit="gajian"}return commit()}
  if(a==="quickSetor"){S.setoranAmount=+el.dataset.v;S.setoranUnit="gajian";return commit()}
  if(a==="addExp"){const desc=$("ex-desc").value.trim(),amt=num($("ex-amt").value),date=$("ex-date").value,cat=$("ex-cat").value;
    if(!desc||amt<=0||!date){ui.form={desc,amt:$("ex-amt").value,date,cat};render();$("ex-err").textContent="Isi keterangan, jumlah, dan tanggal.";return}
    addExpenseRec({desc,amount:amt,date,category:cat});ui.form={cat,date};S.activeMonth=date.slice(0,7);
    const bs=budgetStatus().find(x=>x.cat===cat);
    if(bs&&bs.pct>=1){ui.flash=`Tersimpan. Batas ${bs.c[1]} ${bs.period==="minggu"?"minggu ini":"bulan ini"} sudah lewat ${rp(bs.spent-bs.amount)}.`;ui.flashC="--coral"}
    else if(bs&&bs.pct>=0.8){ui.flash=`Tersimpan. ${bs.c[1]} sudah ${Math.round(bs.pct*100)}% dari batas, sisa ${rp(bs.amount-bs.spent)}.`;ui.flashC="--amber"}
    else ui.flash="Tersimpan.";
    return commit()}
  if(a==="delExp"){const e=S.expenses.find(x=>x.id===id);if(e&&e.billId)Object.keys(S.paid).forEach(k=>{if(S.paid[k]===id)delete S.paid[k]});S.expenses=S.expenses.filter(x=>x.id!==id);return commit()}
  if(a==="tier"){S.tierId=el.dataset.v;return commit()}
  if(a==="resetTiers"){S.tiers=JSON.parse(JSON.stringify(DEFAULT_TIERS));return commit()}
  if(a==="addWeek"){const ws=S.weeks.filter(w=>w.start.slice(0,7)===S.activeMonth).sort((x,y)=>x.start<y.start?-1:1);const last=ws[ws.length-1]||S.weeks.slice().sort((x,y)=>x.start<y.start?-1:1).pop();
    const st=last?iso(addDays(parse(last.start),7)):defaultThursday();S.weeks.push(newWeek(st));S.activeMonth=st.slice(0,7);return commit()}
  if(a==="dupWeek"){const w=S.weeks.find(x=>x.id===id);const st=iso(addDays(parse(w.start),7));S.weeks.push(newWeek(st,w.days));S.activeMonth=st.slice(0,7);return commit()}
  if(a==="delWeek"){S.weeks=S.weeks.filter(w=>w.id!==id);if(ui.editDay&&ui.editDay.wid===id)ui.editDay=null;ui.confirm=null;return commit()}
  if(a==="editDay"){const w=S.weeks.find(x=>x.id===id);if(!w)return;ui.editDay={wid:id,i:+el.dataset.i};ui.confirm=null;S.activeMonth=w.start.slice(0,7);render();const e=$("dayEditor");e&&e.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(a==="closeDay"){ui.editDay=null;ui.confirm=null;return render()}
  if(a==="clearDay"){const w=S.weeks.find(x=>x.id===id),i=+el.dataset.i;if(w){w.days[i]=emptyDay(i)}ui.confirm=null;if(ui.editDay&&ui.editDay.wid===id&&ui.editDay.i===i)ui.editDay=null;return commit()}
  if(a==="saveDay"){const w=S.weeks.find(x=>x.id===id),i=+el.dataset.i;if(!w)return;
    const date=$("de-date").value,status=$("de-status").value,jam=Math.max(0,parseFloat($("de-jam").value)||0),note=$("de-note").value.trim();
    if(!date){$("de-err").textContent="Pilih tanggal.";return}
    if(jam>24){$("de-err").textContent="Jam lembur maksimal 24.";return}
    const nd={status,jamBiasa:status==="hadir"?jam:0,jamMerah:status==="lembur_merah"?jam:0,note};
    const dt=parse(date),orig=addDays(parse(w.start),i);
    if(+dt===+orig){w.days[i]=nd;ui.editDay=null;return commit()}
    let tw=S.weeks.find(x=>{const st=parse(x.start);return dt>=st&&dt<addDays(st,7)});
    if(!tw){const st=addDays(dt,-((dt.getDay()-4+7)%7));tw={id:uid(),start:iso(st),days:Array.from({length:7},()=>({status:"libur",jamBiasa:0,jamMerah:0}))};S.weeks.push(tw)}
    const ti=daysBetween(parse(tw.start),dt);
    w.days[i]={status:"libur",jamBiasa:0,jamMerah:0};tw.days[ti]=nd;
    ui.editDay={wid:tw.id,i:ti};S.activeMonth=tw.start.slice(0,7);return commit()}
  if(a==="editSaldo"){ui.editSaldo=el.dataset.v;render();const e=$("sd-val");e&&e.focus();return}
  if(a==="cancelSaldo"){ui.editSaldo=null;return render()}
  if(a==="saveSaldo"&&el.dataset.v==="now"){const raw=String($("sd-val").value).trim(),v=num(raw),real=raw.startsWith("-")?-Math.abs(v):v,N=nowStats();
    S.saldoAdjNow=S.saldoAdjNow||{};const adj=Math.round(real-N.base);if(adj)S.saldoAdjNow[N.m]=adj;else delete S.saldoAdjNow[N.m];ui.editSaldo=null;return commit()}
  if(a==="clearSaldo"&&el.dataset.v==="now"){if(S.saldoAdjNow)delete S.saldoAdjNow[mk(today0())];return commit()}
  if(a==="saveSaldo"){const m=el.dataset.v,v=num($("sd-val").value),neg=String($("sd-val").value).trim().startsWith("-");const real=neg?-Math.abs(v):v;
    S.saldoAdj=S.saldoAdj||{};const base=saldoBase(m),adj=Math.round(real-base);if(adj)S.saldoAdj[m]=adj;else delete S.saldoAdj[m];ui.editSaldo=null;return commit()}
  if(a==="clearSaldo"){if(S.saldoAdj)delete S.saldoAdj[el.dataset.v];return commit()}
  if(a==="copyData"){const txt=JSON.stringify(S);const done=()=>{const m=$("dataMsg");if(m)m.textContent="Data tersalin. Simpan di catatan atau chat ke diri sendiri."};
    try{navigator.clipboard.writeText(txt).then(done,()=>{ui.copyText=txt;render();const b=$("copyBox");b&&b.select()})}catch(e){ui.copyText=txt;render()}return}
  if(a==="showImport"){ui.importOpen=true;ui.copyText="";return render()}
  if(a==="hideImport"){ui.importOpen=false;return render()}
  if(a==="doImport"){try{const o=JSON.parse($("importBox").value);if(!o||typeof o!=="object")throw 0;
      if(o.bills||o.weeks){S=Object.assign(defaultState(),o);runRecurring()}else throw 0;ui.importOpen=false;commit();$("dataMsg").textContent="Data dipulihkan."}
    catch(e){$("dataMsg").textContent="";$("dataMsg").className="small coral";$("dataMsg").textContent="Teks bukan data Dompet Gajian yang valid."}return}
  if(a==="resetAll"){const tab=S.tab;S=defaultState();S.tab=tab;ui.confirm=null;try{localStorage.removeItem(KEY)}catch(e){}return commit()}
});
document.addEventListener("change",ev=>{
  const el=ev.target;const c=el.dataset&&el.dataset.ch;if(!c)return;const id=el.dataset.id,i=+el.dataset.i;
  if(c==="rfFreq"){const wk=el.value==="mingguan";$("rf-dayW").hidden=!wk;$("rf-dayM").hidden=wk;return}
  if(c==="carryOver")S.carryOver=el.checked;
  else if(c==="setoranUnit")S.setoranUnit=el.value==="bulan"?"bulan":"gajian";
  else if(["dailyLiving","incomeManual","savingsStart","setoranAmount"].includes(c))S[c]=Math.max(0,num(el.value));
  else if(c==="targetMonths")S.targetMonths=Math.min(12,Math.max(1,Math.round(num(el.value))||3));
  else if(c==="joinDate")S.joinDate=el.value;
  else if(c==="wstart"){const w=S.weeks.find(x=>x.id===id);if(w&&el.value){w.start=el.value;S.activeMonth=el.value.slice(0,7)}}
  else if(c==="dstatus"){const d=S.weeks.find(x=>x.id===id).days[i];d.status=el.value;if(d.status!=="hadir")d.jamBiasa=0;if(d.status!=="lembur_merah")d.jamMerah=0}
  else if(c==="jam"){S.weeks.find(x=>x.id===id).days[i][el.dataset.k]=Math.max(0,parseFloat(el.value)||0)}
  else if(c==="tier"){S.tiers.find(x=>x.id===id)[el.dataset.k]=Math.max(0,num(el.value))}
  commit();
});

load();
try{if(runRecurring())save()}catch(e){}
if(location.hash&&TABS.some(t=>t[0]===location.hash.slice(1)))S.tab=location.hash.slice(1);
render();
})();
</script>
</body></html>
